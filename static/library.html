<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Media Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; background:#0f0f0f; color:#fff; margin:0; padding:1rem; }
    h2 { margin: .25rem 0 1rem; }
    .top { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom: 1rem; }
    input, select { padding:.6rem; border-radius:10px; border:none; font-size:1rem; }
    input { flex: 2; min-width: 180px; }
    #extra { flex: 1.5; min-width: 180px; }
    select { flex: 1; min-width: 160px; }
    button { padding:.6rem .9rem; border-radius:10px; border:0; font-size:1rem; }
    #scanBtn { background:#4caf50; color:#000; }
    #refreshBtn { background:#444; color:#fff; }
    .item { background:#1c1c1c; border-radius:14px; padding:.75rem; margin:.5rem 0; display:flex; justify-content:space-between; align-items:center; }
    .meta { color:#aaa; font-size:.85rem; }

    /* === CHANGE #1 (lock page scroll) === */
    body.modalOpen { overflow: hidden; }

    /* === CHANGE #2 (modal scrolling + iOS fix) === */
    .modalBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      align-items: flex-start;
      justify-content: center;
      padding:
        calc(1rem + env(safe-area-inset-top))
        1rem
        calc(1rem + env(safe-area-inset-bottom))
        1rem;
    }

    .modal {
      width: 100%;
      max-width: 640px;
      background:#1c1c1c;
      border-radius:14px;
      padding:1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      max-height: calc(100dvh - 2rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .grid { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
    .row3 { display:grid; grid-template-columns:2fr 1fr 1fr; gap:.75rem; }
    label { font-size:.75rem; color:#aaa; }
    .actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; }
    .actions button { background:#444; color:#fff; }
    .actions .save { background:#4caf50; color:#000; }
    textarea { width:100%; min-height:80px; resize:vertical; padding:.6rem; border-radius:10px; border:0; }
  </style>
</head>
<body>
  <h2>My Media Library</h2>

  <div class="top">
    <input id="q" placeholder="Search…" />
    <input id="extra" placeholder="Location / Notes…" />
    <select id="type">
      <option value="">All</option>
      <option value="movie">Movies</option>
      <option value="book">Books</option>
      <option value="music">Music</option>
      <option value="game">Games</option>
      <option value="unknown">Unknown</option>
    </select>
    <button id="refreshBtn">Refresh</button>
    <button id="scanBtn" onclick="location.href='/ui/scan.html'">Scan</button>
  </div>

  <div id="list"></div>

  <!-- Edit Modal -->
  <div id="backdrop" class="modalBackdrop">
    <div class="modal">
      <h3>Edit Item</h3>

      <div class="grid">
        <div>
          <label>Title (display)</label>
          <input id="mTitle" />
        </div>
        <div>
          <label>Media type</label>
          <select id="mType">
            <option value="movie">movie</option>
            <option value="book">book</option>
            <option value="music">music</option>
            <option value="game">game</option>
            <option value="unknown">unknown</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Title raw (from lookup)</label>
          <input id="mTitleRaw" />
        </div>
        <div>
          <label>Author (books)</label>
          <input id="mAuthor" placeholder="e.g., Ursula K. Le Guin" />
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Platform / Console (games)</label>
          <input id="mPlatform" placeholder="PS5, Switch, Xbox 360…" />
        </div>
        <div>
          <label>Format</label>
          <input id="mFormat" placeholder="disc/cart/digital, 4K/Blu-ray/DVD…" />
        </div>
      </div>

      <div class="row3">
        <div>
          <label>Location</label>
          <input id="mLocation" placeholder="Shelf A, Bin 3, Office…" />
        </div>
        <div>
          <label>Release year</label>
          <input id="mYear" type="number" min="1950" max="2100" placeholder="2007" />
        </div>
        <div>
          <label>Status</label>
          <select id="mStatus">
            <option value="">(none)</option>
            <option value="owned">owned</option>
            <option value="lent">lent</option>
            <option value="wishlist">wishlist</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Cover URL</label>
          <input id="mCover" placeholder="https://…" />
        </div>
      </div>

      <div>
        <label>Notes</label>
        <textarea id="mNotes" placeholder="Optional notes…"></textarea>
      </div>

      <div class="meta" id="mMeta"></div>

      <div class="actions">
        <button onclick="closeEdit()">Cancel</button>
        <button class="save" onclick="saveEdit()">Save</button>
      </div>
    </div>
  </div>

<script>
let currentItems = [];
let editingItem = null;
const list = document.getElementById("list");
const backdrop = document.getElementById("backdrop");

async function load() {
  const res = await fetch("/api/items");
  currentItems = await res.json();
  render();
}

function render() {
  list.innerHTML = "";
  currentItems.forEach(item => {
    const d = document.createElement("div");
    d.className = "item";
    d.innerHTML = `
      <div>
        <strong>${item.title || "Unknown Item"}</strong>
        <div class="meta">${item.media_type || ""}</div>
      </div>
      <button onclick="openEdit(${item.id})">Edit</button>
    `;
    list.appendChild(d);
  });
}

function openEdit(id) {
  const item = currentItems.find(x => x.id === id);
  if (!item) return;
  editingItem = item;

  mTitle.value = item.title || "";
  mType.value = item.media_type || "unknown";
  mTitleRaw.value = item.title_raw || "";
  mAuthor.value = item.author || "";
  mPlatform.value = item.platform || "";
  mFormat.value = item.format || "";
  mLocation.value = item.location || "";
  mYear.value = item.release_year || "";
  mStatus.value = item.status || "";
  mCover.value = item.cover_url || "";
  mNotes.value = item.notes || "";

  mMeta.textContent =
    `barcode: ${item.barcode || "—"} • source: ${item.source || "none"} • added: ${item.added_at || "—"} • updated: ${item.updated_at || "—"}`;

  document.body.classList.add("modalOpen");
  backdrop.style.display = "flex";
  backdrop.scrollTop = 0;
}

function closeEdit() {
  backdrop.style.display = "none";
  document.body.classList.remove("modalOpen");
  editingItem = null;
}

async function saveEdit() {
  if (!editingItem) return;
  await fetch(`/api/items/${editingItem.id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title: mTitle.value,
      media_type: mType.value,
      title_raw: mTitleRaw.value,
      author: mAuthor.value,
      platform: mPlatform.value,
      format: mFormat.value,
      location: mLocation.value,
      release_year: mYear.value,
      status: mStatus.value,
      cover_url: mCover.value,
      notes: mNotes.value
    })
  });
  closeEdit();
  load();
}

load();
</script>
</body>
</html>
