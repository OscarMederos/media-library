<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Media Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; background:#0f0f0f; color:#fff; margin:0; padding:1rem; }
    h2 { margin: .25rem 0 1rem; }
    .top { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom: 1rem; }
    input, select { padding:.6rem; border-radius:10px; border:none; font-size:1rem; }
    input { flex: 2; min-width: 180px; }
    #extra { flex: 1.5; min-width: 180px; }
    select { flex: 1; min-width: 160px; }
    button { padding:.6rem .9rem; border-radius:10px; border:0; font-size:1rem; }
    #scanBtn { background:#4caf50; color:#000; }
    #refreshBtn { background:#1e88e5; color:#fff; }
    .pill { display:inline-block; padding:.15rem .45rem; border-radius:999px; background:#2a2a2a; margin-left:.35rem; font-size:.85rem; color:#ddd; }

    .item { background:#1c1c1c; padding:.85rem; border-radius:12px; margin-bottom:.6rem; }
    .title { font-weight:650; font-size: 1.02rem; margin-bottom: .15rem; }
    .meta { color:#aaa; font-size:.88rem; margin-bottom: .35rem; }
    .submeta { color:#888; font-size:.85rem; margin-bottom: .6rem; }
    .actions { display:flex; gap:.5rem; flex-wrap: wrap; }
    .actions button { font-size:.95rem; padding:.5rem .75rem; }
    .edit { background:#ffb300; color:#000; }
    .enrich { background:#7e57c2; color:#fff; }
    .enrich[disabled] { opacity: .7; }
    .del { background:#ef5350; color:#fff; }

    .empty { color:#777; text-align:center; margin-top:2rem; }

    .errorBox {
      background:#2a1414;
      border: 1px solid #5a1f1f;
      color:#ffd6d6;
      padding:.75rem;
      border-radius:12px;
      margin: .75rem 0 1rem;
      font-size: .95rem;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    /* Modal */
    body.modalOpen { overflow: hidden; }

    .modalBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);

      display:none;
      justify-content:center;

      /* iOS Safari: allow the modal to be scrollable when it's taller than the viewport */
      align-items:flex-start;
      overflow:auto;
      -webkit-overflow-scrolling: touch;

      padding:1rem;
    }

    .modal {
      width: 100%;
      max-width: 640px;
      background:#1c1c1c;
      border-radius:14px;
      padding:1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);

      /* keep modal content reachable on small screens / when browser chrome changes */
      max-height: calc(100vh - 2rem);
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }

    @supports (height: 100dvh) {
      .modal { max-height: calc(100dvh - 2rem); }
    }

    .modal h3 { margin: 0 0 .75rem; }
    .grid { display:grid; grid-template-columns: 1fr; gap:.6rem; }
    .grid label { font-size:.9rem; color:#bbb; }
    .grid input, .grid textarea, .grid select { width:100%; box-sizing:border-box; }
    textarea { min-height: 80px; resize: vertical; }
    .row2 { display:grid; grid-template-columns: 1fr 1fr; gap:.6rem; }
    .row3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:.6rem; }
    @media (max-width: 520px) {
      .row2, .row3 { grid-template-columns: 1fr; }
    }

    .modalActions {
      display:flex;
      gap:.5rem;
      justify-content:flex-end;
      flex-wrap: wrap;
      margin-top: .8rem;

      /* keep Save/Cancel visible on phones */
      position: sticky;
      bottom: 0;
      background:#1c1c1c;
      padding-top: .8rem;
      padding-bottom: calc(.6rem + env(safe-area-inset-bottom));
    }

    .save { background:#4caf50; color:#000; }
    .cancel { background:#444; color:#fff; }
    .note { color:#aaa; font-size:.9rem; margin-top:.3rem; }
    .hidden { display:none !important; }
  </style>
</head>

<body>
  <h2>📚 My Library <span id="net" class="pill">…</span></h2>

  <div class="top">
    <input id="search" type="search" placeholder="Search title…" />
    <input id="extra" type="search" class="hidden" placeholder="Author / Platform…" />
    <select id="filter">
      <option value="">All types</option>
      <option value="book">Books</option>
      <option value="movie">Movies</option>
      <option value="game">Games</option>
      <option value="unknown">Unknown</option>
    </select>
    <button id="refreshBtn" type="button">Refresh</button>
    <button id="scanBtn" type="button" onclick="location.href='/ui/scan.html'">Scan</button>
    <button id="addBtn" type="button" onclick="location.href='/ui/add.html'">Add</button>
    <button id="randomBtn" type="button" onclick="location.href='/ui/random.html'">Random</button>
  </div>

  <div id="list"></div>

  <div id="loadMoreWrap" class="hidden" style="text-align:center; margin-top:1rem;">
    <div id="pageStatus" class="note" style="margin-bottom:.5rem;"></div>
    <button id="loadMoreBtn" type="button">Load more</button>
  </div>

  <!-- Edit Modal -->
  <div id="backdrop" class="modalBackdrop" role="dialog" aria-modal="true" aria-label="Edit Item">
    <div class="modal">
      <h3>Edit Item</h3>

      <div class="grid">
        <div class="row2">
          <div>
            <label>Title (display)</label>
            <input id="mTitle" />
          </div>
          <div>
            <label>Media type</label>
            <select id="mType">
              <option value="book">book</option>
              <option value="movie">movie</option>
              <option value="game">game</option>
              <option value="unknown">unknown</option>
            </select>
          </div>
        </div>

        <div>
          <label>Title raw (from lookup)</label>
          <input id="mTitleRaw" />
        </div>

        <div id="authorRow" class="row2 hidden">
          <div style="grid-column: 1 / -1;">
            <label>Author (books)</label>
            <input id="mAuthor" placeholder="e.g., Ursula K. Le Guin" />
          </div>
        </div>

        <div id="developerRow" class="row2 hidden">
          <div style="grid-column: 1 / -1;">
            <label>Developer (games)</label>
            <input id="mDeveloper" placeholder="e.g., Nintendo, Capcom, Naughty Dog" />
          </div>
        </div>


        <div id="igdbRow" class="row2 hidden">
          <div>
            <label>IGDB Game ID</label>
            <input id="mIgdbGameId" type="number" min="0" step="1" placeholder="e.g., 1020" />
          </div>
          <div>
            <label>IGDB Cover Image ID</label>
            <input id="mIgdbCoverImageId" type="number" min="0" step="1" placeholder="e.g., 987654" />
          </div>
        </div>

        <div id="igdbRow2" class="row2 hidden">
          <div style="grid-column: 1 / -1;">
            <label>IGDB Last Enriched At</label>
            <input id="mIgdbLastEnrichedAt" placeholder="YYYY-MM-DD HH:MM:SS" />
          </div>
        </div>

        <div class="row3">
          <div>
            <label>Platform / Console (games)</label>
            <input id="mPlatform" placeholder="PS5, Switch, Xbox 360…" />
          </div>
          <div>
            <label>Format</label>
            <input id="mFormat" placeholder="disc/cart/digital, 4K/Blu-ray/DVD…" />
          </div>
          <div>
            <label>Release year</label>
            <input id="mYear" type="number" min="1950" max="2100" placeholder="2007" />
          </div>
        </div>

        <div class="row3">
          <div>
            <label>Location</label>
            <input id="mLocation" placeholder="Shelf A, Bin 3, Office…" />
          </div>
          <div>
            <label>Status</label>
            <select id="mStatus">
              <option value="">(none)</option>
              <option value="owned">owned</option>
              <option value="backlog">backlog</option>
              <option value="in_progress">in_progress</option>
              <option value="completed">completed</option>
              <option value="loaned">loaned</option>
            </select>
          </div>
          <div>
            <label>Cover URL</label>
            <input id="mCoverUrl" placeholder="https://…" />
          </div>
        </div>

        <div>
          <label>Notes</label>
          <textarea id="mNotes" placeholder="Optional notes…"></textarea>
        </div>

        <div class="note" id="mMeta"></div>
      </div>

      <div class="modalActions">
        <button class="cancel" id="cancelBtn" type="button">Cancel</button>
        <button class="save" id="saveBtn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 100;

    const listEl = document.getElementById("list");
    const searchEl = document.getElementById("search");
    const extraEl = document.getElementById("extra");
    const filterEl = document.getElementById("filter");
    const refreshBtn = document.getElementById("refreshBtn");
    const netEl = document.getElementById("net");
    const loadMoreWrap = document.getElementById("loadMoreWrap");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const pageStatus = document.getElementById("pageStatus");

    const backdrop = document.getElementById("backdrop");
    const mTitle = document.getElementById("mTitle");
    const mTitleRaw = document.getElementById("mTitleRaw");
    const mType = document.getElementById("mType");
    const authorRow = document.getElementById("authorRow");
    const developerRow = document.getElementById("developerRow");
    const mAuthor = document.getElementById("mAuthor");
    const mDeveloper = document.getElementById("mDeveloper");
    const igdbRow = document.getElementById("igdbRow");
    const igdbRow2 = document.getElementById("igdbRow2");
    const mIgdbGameId = document.getElementById("mIgdbGameId");
    const mIgdbCoverImageId = document.getElementById("mIgdbCoverImageId");
    const mIgdbLastEnrichedAt = document.getElementById("mIgdbLastEnrichedAt");
    const mPlatform = document.getElementById("mPlatform");
    const mFormat = document.getElementById("mFormat");
    const mYear = document.getElementById("mYear");
    const mLocation = document.getElementById("mLocation");
    const mStatus = document.getElementById("mStatus");
    const mCoverUrl = document.getElementById("mCoverUrl");
    const mNotes = document.getElementById("mNotes");
    const mMeta = document.getElementById("mMeta");

    const cancelBtn = document.getElementById("cancelBtn");
    const saveBtn = document.getElementById("saveBtn");

    let currentItems = [];
    let totalCount = 0;
    let editingItem = null;

    function idEq(a, b) { return String(a) === String(b); }

    function updateNet() {
      netEl.textContent = navigator.onLine ? "online" : "offline";
    }

    function showError(message) {
      listEl.innerHTML = `<div class="errorBox">${escapeHtml(message)}</div>`;
    }

    function escapeHtml(s) {
      const str = String(s ?? "");
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function fmt(v) { return (v === null || v === undefined || v === "") ? "—" : String(v); }
    function norm(s) { return String(s ?? "").toLowerCase().trim(); }
    function isBlank(v) { return v === null || v === undefined || String(v).trim() === ""; }

    function updateExtraUI() {
      const t = filterEl.value;
      if (t === "book") {
        extraEl.classList.remove("hidden");
        extraEl.placeholder = "Filter by author…";
      } else if (t === "game") {
        extraEl.classList.remove("hidden");
        extraEl.placeholder = "Filter by platform / developer…";
      } else {
        extraEl.classList.add("hidden");
        extraEl.value = "";
      }
    }

    function applyFilters(items) {
      const t = filterEl.value;
      const q = norm(searchEl.value);
      const extra = norm(extraEl.value);

      return (items || []).filter(item => {
        const mt = norm(item.media_type || "unknown");
        if (t && mt !== norm(t)) return false;

        if (q) {
          const titleOk = norm(item.title).includes(q);
          if (!titleOk) return false;
        }

        if (extra) {
          if (t === "book") {
            if (!norm(item.author).includes(extra)) return false;
          } else if (t === "game") {
            const platformOk = norm(item.platform).includes(extra);
            const devOk = norm(item.developer).includes(extra);
            if (!platformOk && !devOk) return false;
          }
        }

        return true;
      });
    }

    function safeParseJson(raw) {
      if (!raw) return null;
      if (typeof raw === "object") return raw;
      if (typeof raw !== "string") return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    function getOmdb(item) {
      if (!item) return null;
      if (item._omdbParsed !== undefined) return item._omdbParsed;
      const parsed = safeParseJson(item.omdb_raw_json);
      item._omdbParsed = parsed || null;
      return item._omdbParsed;
    }

    function getDirectorDisplay(item) {
      const mt = norm(item.media_type || "unknown");
      if (mt !== "movie") return "";
      const omdb = getOmdb(item);
      const dir = (omdb && typeof omdb.Director === "string") ? omdb.Director.trim() : "";
      if (!dir || dir.toUpperCase() === "N/A") return "";
      return ` • ${dir}`;
    }

    function shouldShowOmdbEnrich(item) {
      const mt = norm(item.media_type || "unknown");
      if (mt !== "movie") return false;
      const status = norm(item.omdb_status || "");
      return status !== "ok";
    }
    function shouldShowRelookup(item) {
      const title = norm(item.title || "");
      const mt = norm(item.media_type || "unknown");
      return title === "unknown book" || title === "unknown item" || mt === "unknown";
    }
    function shouldShowIgdbEnrich(item) {
      const mt = norm(item.media_type || "unknown");
      if (mt !== "game") return false;

      // If we've already enriched (or at least attempted and stored an id/timestamp), don't show again.
      if (!isBlank(item.igdb_last_enriched_at) || !isBlank(item.igdb_game_id)) return false;

      const missingDeveloper = isBlank(item.developer);
      const missingYear = isBlank(item.release_year);
      const missingCover = isBlank(item.cover_url);
      const missingIgdbId = isBlank(item.igdb_game_id);
      return missingDeveloper || missingYear || missingCover || missingIgdbId;
    }

    async function doRelookup(id, btn) {
      const originalText = btn ? btn.textContent : null;
      try {
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Retrying…";
        }
        const resp = await fetch(`/media/${encodeURIComponent(String(id))}/relookup`, { method: "POST" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();
        await load();
        if (data.status === "still_unknown") {
          alert("Still no match found for this barcode.");
        }
      } catch (e) {
        alert("Retry lookup failed: " + e);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = originalText || "Retry lookup";
        }
      }
    }

    // Single handler for both providers now that the backend returns one
    // consistent envelope: {status, reason, item}. status is "ok" | "not_found"
    // | "skipped" | "error"; reason is always present (null on success).
    async function doEnrich(id, btn, provider, label) {
      const originalText = btn ? btn.textContent : null;
      try {
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Enriching…";
        }
        const resp = await fetch(`/media/${encodeURIComponent(String(id))}/enrich?provider=${provider}`, { method: "POST" });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) throw new Error(data?.detail || "HTTP " + resp.status);

        if (data?.status === "not_found") {
          alert(`${label}: no match found for this item.`);
        } else if (data?.status === "skipped") {
          alert(`${label}: skipped (${data.reason || "n/a"}).`);
        } else if (data?.status === "error") {
          alert(`${label} failed: ${data.reason || "unknown error"}`);
        }

        await load();
      } catch (e) {
        alert(`${label} failed: ` + e);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = originalText || label;
        }
      }
    }

    function doEnrichOmdb(id, btn) { return doEnrich(id, btn, "omdb", "OMDb"); }
    function doEnrichIgdb(id, btn) { return doEnrich(id, btn, "igdb", "IGDB"); }

    function render(items) {
      listEl.innerHTML = "";
      if (!items || !items.length) {
        listEl.innerHTML = `<div class="empty">No media found</div>`;
        return;
      }

      for (const item of items) {
        const div = document.createElement("div");
        div.className = "item";

        const type = item.media_type ?? "unknown";
        const author = (type === "book" && item.author) ? ` • ${item.author}` : "";
        const dev = (type === "game" && item.developer) ? ` • ${item.developer}` : "";
        const plat = item.platform ? ` • ${item.platform}` : "";
        const loc = item.location ? ` • ${item.location}` : "";
        const st = item.status ? ` • ${item.status}` : "";
        const yr = item.release_year ? ` • ${item.release_year}` : "";
        const fmtStr = item.format ? ` • ${item.format}` : "";
        const director = getDirectorDisplay(item);

        const omdbBtn = shouldShowOmdbEnrich(item)
          ? `<button class="enrich enrich-omdb" type="button">OMDb</button>`
          : "";

        const igdbBtn = shouldShowIgdbEnrich(item)
          ? `<button class="enrich enrich-igdb" type="button">IGDB</button>`
          : "";

        const relookupBtn = shouldShowRelookup(item)
          ? `<button class="enrich relookup" type="button">Retry lookup</button>`
          : "";

        div.innerHTML = `
          <div class="title">${escapeHtml(item.title)}</div>
          <div class="meta">${escapeHtml(type)}${escapeHtml(author)}${escapeHtml(dev)}${escapeHtml(plat)}${escapeHtml(fmtStr)}${escapeHtml(yr)}${escapeHtml(director)}</div>
          <div class="submeta">barcode: ${escapeHtml(item.barcode)} • id:${escapeHtml(item.id)}${escapeHtml(loc)}${escapeHtml(st)}</div>
          <div class="actions">
            <button class="edit" type="button">Edit</button>
            ${omdbBtn}
            ${igdbBtn}
            ${relookupBtn}
            <button class="del" type="button">Delete</button>
          </div>
        `;

        div.querySelector(".edit").addEventListener("click", () => openEdit(item.id));
        div.querySelector(".del").addEventListener("click", () => doDelete(item.id));

        const omdb = div.querySelector(".enrich-omdb");
        if (omdb) omdb.addEventListener("click", () => doEnrichOmdb(item.id, omdb));

        const igdb = div.querySelector(".enrich-igdb");
        if (igdb) igdb.addEventListener("click", () => doEnrichIgdb(item.id, igdb));

        const relookup = div.querySelector(".relookup");
        if (relookup) relookup.addEventListener("click", () => doRelookup(item.id, relookup));  

        listEl.appendChild(div);
      }
    }

    function rerender() {
      render(applyFilters(currentItems));
      updatePaginationUI();
    }

    async function fetchMediaNetwork(offset) {
      const params = new URLSearchParams();
      const t = filterEl.value;
      params.set("limit", String(PAGE_SIZE));
      params.set("offset", String(offset));

      if (t) params.set("media_type", t);
      if (searchEl.value) params.set("search", searchEl.value);

      if (extraEl.value) {
        if (t === "book") params.set("author", extraEl.value);
        if (t === "game") params.set("platform", extraEl.value);
      }

      const resp = await fetch("/media?" + params.toString());
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      if (!data || !Array.isArray(data.items) || typeof data.total !== "number") {
        throw new Error("Unexpected /media response (expected {items, total}).");
      }
      return data;
    }

    function updatePaginationUI() {
      const loaded = currentItems.length;
      if (totalCount > loaded) {
        loadMoreWrap.classList.remove("hidden");
        pageStatus.textContent = `Showing ${loaded} of ${totalCount}`;
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = "Load more";
      } else if (loaded > 0) {
        loadMoreWrap.classList.remove("hidden");
        pageStatus.textContent = `Showing all ${loaded}`;
        loadMoreBtn.disabled = true;
        loadMoreBtn.textContent = "Load more";
      } else {
        loadMoreWrap.classList.add("hidden");
      }
    }

    async function load() {
      updateNet();

      if (!navigator.onLine) {
        showError("You're offline — reconnect to load the library.");
        return;
      }

      try {
        const { items, total } = await fetchMediaNetwork(0);
        currentItems = items;
        totalCount = total;
        rerender();
      } catch (e) {
        console.log("load failed:", e);
        showError(`Failed to load /media.\n\n${String(e)}`);
      }
    }

    async function loadMore() {
      if (currentItems.length >= totalCount) return;
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = "Loading…";
      try {
        const { items, total } = await fetchMediaNetwork(currentItems.length);
        currentItems = currentItems.concat(items);
        totalCount = total;
        rerender();
      } catch (e) {
        alert("Failed to load more items: " + e);
        updatePaginationUI();
      }
    }

    function openEdit(id) {
      const item = currentItems.find(x => idEq(x.id, id));
      if (!item) return;

      editingItem = item;

      mTitle.value = item.title ?? "";
      mTitleRaw.value = item.title_raw ?? "";
      mType.value = item.media_type ?? "unknown";

      mAuthor.value = item.author ?? "";
      mDeveloper.value = item.developer ?? "";
      mPlatform.value = item.platform ?? "";
      mFormat.value = item.format ?? "";
      mYear.value = item.release_year ?? "";

      mLocation.value = item.location ?? "";
      mStatus.value = item.status ?? "";

      mCoverUrl.value = item.cover_url ?? "";
      mNotes.value = item.notes ?? "";

      mIgdbGameId.value = item.igdb_game_id ?? "";
      mIgdbCoverImageId.value = item.igdb_cover_image_id ?? "";
      mIgdbLastEnrichedAt.value = item.igdb_last_enriched_at ?? "";

      updateModalVisibility();

      const igdbMeta = (item.igdb_game_id || item.igdb_last_enriched_at)
        ? ` • igdb: ${fmt(item.igdb_game_id)} @ ${fmt(item.igdb_last_enriched_at)}`
        : "";

      const omdbMeta = (item.omdb_status || item.omdb_last_fetched_at)
        ? ` • omdb: ${fmt(item.omdb_status)} @ ${fmt(item.omdb_last_fetched_at)}`
        : "";

      mMeta.textContent =
        `barcode: ${fmt(item.barcode)} • source: ${fmt(item.source)} • added: ${fmt(item.added_at)} • updated: ${fmt(item.updated_at)}${omdbMeta}${igdbMeta}`;

      backdrop.style.display = "flex";
      document.body.classList.add("modalOpen");
    }

    function updateModalVisibility() {
      const t = mType.value;
      if (t === "book") authorRow.classList.remove("hidden");
      else authorRow.classList.add("hidden");

      if (t === "game") {
        developerRow.classList.remove("hidden");
        igdbRow.classList.remove("hidden");
        igdbRow2.classList.remove("hidden");
      } else {
        developerRow.classList.add("hidden");
        igdbRow.classList.add("hidden");
        igdbRow2.classList.add("hidden");
      }
    }

    function closeEdit() {
      backdrop.style.display = "none";
      document.body.classList.remove("modalOpen");
      editingItem = null;
    }

    async function saveEdit() {
      if (!editingItem) return;

      const yearVal = String(mYear.value ?? "").trim();
      const typeVal = mType.value;

      const patch = {
        title: mTitle.value,
        title_raw: mTitleRaw.value,
        media_type: typeVal,

        author: (typeVal === "book") ? mAuthor.value : "",
        developer: (typeVal === "game") ? mDeveloper.value : "",
        platform: mPlatform.value,

        format: mFormat.value,
        location: mLocation.value,
        status: mStatus.value,
        release_year: yearVal ? parseInt(yearVal, 10) : null,
        cover_url: mCoverUrl.value,
        notes: mNotes.value,
        igdb_game_id: (typeVal === "game") ? (String(mIgdbGameId.value ?? "").trim() ? parseInt(String(mIgdbGameId.value).trim(), 10) : null) : null,
        igdb_cover_image_id: (typeVal === "game") ? (String(mIgdbCoverImageId.value ?? "").trim() ? parseInt(String(mIgdbCoverImageId.value).trim(), 10) : null) : null,
        igdb_last_enriched_at: (typeVal === "game") ? (String(mIgdbLastEnrichedAt.value ?? "").trim() || null) : null
      };

      try {
        const resp = await fetch(`/media/${encodeURIComponent(String(editingItem.id))}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(patch)
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        const data = await resp.json();
        const updated = data.item;
        if (!updated) throw new Error("Unexpected PATCH response (missing item).");

        currentItems = currentItems.map(x => idEq(x.id, updated.id) ? updated : x);
        rerender();
        closeEdit();
      } catch (e) {
        alert("Update failed: " + e);
      }
    }

    async function doDelete(id) {
      const item = currentItems.find(x => idEq(x.id, id));
      const label = item ? `${item.title} (${item.barcode})` : `id ${id}`;
      if (!confirm("Delete " + label + "?")) return;

      try {
        const resp = await fetch(`/media/${encodeURIComponent(String(id))}`, { method: "DELETE" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        currentItems = currentItems.filter(x => !idEq(x.id, id));
        totalCount = Math.max(0, totalCount - 1);
        rerender();
      } catch (e) {
        alert("Delete failed: " + e);
      }
    }

    // Events
    cancelBtn.addEventListener("click", closeEdit);
    saveBtn.addEventListener("click", saveEdit);
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeEdit(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && editingItem) closeEdit(); });

    refreshBtn.addEventListener("click", () => load());
    loadMoreBtn.addEventListener("click", () => loadMore());
    window.addEventListener("online", () => load());
    window.addEventListener("offline", () => updateNet());

    // Keep it simple: rerender locally when offline, otherwise refresh from server.
    searchEl.addEventListener("input", () => {
      if (navigator.onLine) load();
      else rerender();
    });

    extraEl.addEventListener("input", () => {
      if (navigator.onLine) load();
      else rerender();
    });

    filterEl.addEventListener("change", () => {
      updateExtraUI();
      load();
    });

    mType.addEventListener("change", updateModalVisibility);

    // Earlier versions of this app installed a service worker (media/sq.js)
    // and cached the media list in localStorage. Both are gone now — this
    // unregisters any leftover SW and clears any old cache data still sitting
    // on a returning device, so old devices self-heal instead of needing a
    // manual "clear site data" like previous deploys required.
    (function cleanupLegacyCaching() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(regs => regs.forEach(r => r.unregister()))
          .catch(() => {});
      }
      if ("caches" in window) {
        caches.keys()
          .then(keys => Promise.all(keys.map(k => caches.delete(k))))
          .catch(() => {});
      }
      try { localStorage.removeItem("mediaLibrary.mediaCache.v8"); } catch {}
    })();

    // Boot
    try {
      updateExtraUI();
      updateNet();
      load();
    } catch (e) {
      console.log("init failed:", e);
      showError("Library UI failed to initialize.\n\n" + String(e));
    }
  </script>
</body>
</html>
