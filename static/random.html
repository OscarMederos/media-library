<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Random Pick</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      padding: 1rem;
      max-width: 560px;
      margin: 0 auto;
    }
    h2 { text-align: center; }

    .row {
      display: flex;
      gap: .5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: .75rem;
    }
    button {
      font-size: 1.05rem;
      padding: .7rem 1rem;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
    }
    #library { background: #1e88e5; color: #fff; }
    #pickBtn { background: #4caf50; color: #000; }
    button:disabled { opacity: .6; cursor: default; }

    .card {
      background: #1c1c1c;
      padding: 1rem;
      border-radius: 12px;
      margin-top: 1rem;
    }
    .cover {
      display: block;
      max-width: 100%;
      max-height: 320px;
      margin: 0 auto .9rem;
      border-radius: 8px;
    }
    .noCover {
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #262626;
      border-radius: 8px;
      color: #666;
      margin-bottom: .9rem;
      font-size: .95rem;
    }
    .title { font-size: 1.25rem; font-weight: 650; margin-bottom: .2rem; }
    .rating { color: #ffb300; font-size: .95rem; letter-spacing: .05em; margin-left: .4rem; }
    .meta { color: #aaa; font-size: .92rem; margin-bottom: .6rem; }

    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .3rem .75rem; }
    dt { color: #888; font-size: .88rem; }
    dd { margin: 0; font-size: .92rem; word-break: break-word; }

    .note { color: #888; text-align: center; font-size: .9rem; margin-top: .75rem; }
    .errorBox {
      background: #2a1414;
      border: 1px solid #5a1f1f;
      color: #ffd6d6;
      padding: .75rem;
      border-radius: 12px;
      margin-top: 1rem;
      font-size: .95rem;
      white-space: pre-wrap;
    }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <h2>🎲 Random Pick</h2>

  <div class="row">
    <button id="pickBtn" type="button">Pick Something</button>
    <button id="library" type="button" onclick="location.href='/ui/library.html'">View Library</button>
  </div>

  <div id="result"></div>
  <div id="status" class="note"></div>

  <script>
    const pickBtn = document.getElementById("pickBtn");
    const resultEl = document.getElementById("result");
    const statusEl = document.getElementById("status");

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isBlank(v) { return v === null || v === undefined || String(v).trim() === ""; }

    // Same normalisation the library list uses: anything not an integer 1-5 is "unrated".
    function normRating(v) {
      const n = Number(v);
      return (Number.isInteger(n) && n >= 1 && n <= 5) ? n : null;
    }

    function ratingBadge(v) {
      const n = normRating(v);
      if (n === null) return "";
      return `<span class="rating" title="${n} of 5">${"★".repeat(n)}${"☆".repeat(5 - n)}</span>`;
    }

    // One page of /media, used both to read `total` and to fetch the chosen row.
    async function fetchPage(offset) {
      const resp = await fetch(`/media?limit=1&offset=${encodeURIComponent(String(offset))}`);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      if (!data || !Array.isArray(data.items) || typeof data.total !== "number") {
        throw new Error("Unexpected /media response (expected {items, total}).");
      }
      return data;
    }

    function showError(message) {
      resultEl.innerHTML = `<div class="errorBox">${escapeHtml(message)}</div>`;
      statusEl.textContent = "";
    }

    function detailRows(item) {
      // [label, value] pairs, with blanks dropped so the list stays tight.
      const pairs = [
        ["Type", item.media_type],
        ["Author", item.media_type === "book" ? item.author : null],
        ["Developer", item.media_type === "game" ? item.developer : null],
        ["Platform", item.platform],
        ["Format", item.format],
        ["Year", item.release_year],
        ["Status", item.status],
        ["Location", item.location],
        ["Barcode", item.barcode],
        ["Notes", item.notes],
      ];

      return pairs
        .filter(([, v]) => !isBlank(v))
        .map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`)
        .join("");
    }

    function render(item, total) {
      const cover = isBlank(item.cover_url)
        ? `<div class="noCover">no cover</div>`
        : `<img class="cover" src="${escapeHtml(item.cover_url)}" alt="" onerror="this.remove()" />`;

      resultEl.innerHTML = `
        <div class="card">
          ${cover}
          <div class="title">${escapeHtml(item.title)}${ratingBadge(item.rating)}</div>
          <div class="meta">id: ${escapeHtml(item.id)}</div>
          <dl>${detailRows(item)}</dl>
        </div>
      `;
      statusEl.textContent = `picked 1 of ${total}`;
    }

    async function pick() {
      pickBtn.disabled = true;
      pickBtn.textContent = "Picking…";
      statusEl.textContent = "";

      try {
        // First call is only for `total` — /media returns it alongside every page.
        const { total } = await fetchPage(0);

        if (total < 1) {
          showError("The library is empty — nothing to pick.");
          return;
        }

        // Random OFFSET, not a random id: ids have gaps wherever rows were
        // deleted, so an id-based pick would 404 often and skew the result.
        // Offsets are dense in [0, total-1], so every row is equally likely.
        const offset = Math.floor(Math.random() * total);
        const page = await fetchPage(offset);

        // A row deleted between the two calls can leave the last offset empty.
        if (!page.items.length) {
          showError("That pick vanished (the library changed mid-request). Try again.");
          return;
        }

        render(page.items[0], page.total);
      } catch (e) {
        console.log("pick failed:", e);
        showError(`Failed to pick an item.\n\n${String(e)}`);
      } finally {
        pickBtn.disabled = false;
        pickBtn.textContent = "Pick Something";
      }
    }

    pickBtn.addEventListener("click", pick);
  </script>
</body>
</html>
