<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Random Pick</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    .row {
      display: flex;
      gap: .5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: .75rem;
    }
    button {
      font-size: 1.05rem;
      padding: .7rem 1rem;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
    }
    #library { background: #1e88e5; color: #fff; }
    #pickBtn { background: #4caf50; color: #000; }
    #pickBtn:disabled { opacity: .6; cursor: default; }

    .card {
      background: #1c1c1c;
      padding: 1rem;
      border-radius: 12px;
      margin: 1rem auto 0;
      max-width: 520px;
      text-align: left;
    }
    .muted { color: #aaa; }
    .err { color: #ef5350; }

    .kv { margin-top: .45rem; }
    .k { font-weight: 650; }
    .v { margin-left: .25rem; }

    .thumb {
      display: block;
      width: 100%;
      max-width: 260px;
      border-radius: 10px;
      margin: .75rem auto 0;
      background: #000;
    }
    .thumb-placeholder {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 2 / 3;
      margin: .75rem auto 0;
      border-radius: 10px;
      background: #0c0c0c;
      border: 1px dashed #333;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 2rem;
    }
  </style>
</head>

<body>
  <h2>🎲 Random Pick</h2>

  <div class="row">
    <button id="library" onclick="location.href='/ui/library.html'">View Library</button>
  </div>

  <div class="row">
    <button id="pickBtn" type="button">Pick Something</button>
  </div>

  <div id="resultCard" class="card" style="display:none;">
    <img id="cover" class="thumb" alt="" style="display:none;" />
    <div id="coverPlaceholder" class="thumb-placeholder" style="display:none;">🎬📚🎮</div>

    <div class="kv"><span class="k">Title:</span><span id="fTitle" class="v muted">—</span></div>
    <div class="kv"><span class="k">Type:</span><span id="fType" class="v muted">—</span></div>
    <div class="kv"><span class="k">Author:</span><span id="fAuthor" class="v muted">—</span></div>
    <div class="kv"><span class="k">Platform:</span><span id="fPlatform" class="v muted">—</span></div>
    <div class="kv"><span class="k">Developer:</span><span id="fDeveloper" class="v muted">—</span></div>
    <div class="kv"><span class="k">Format:</span><span id="fFormat" class="v muted">—</span></div>
    <div class="kv"><span class="k">Release year:</span><span id="fYear" class="v muted">—</span></div>
    <div class="kv"><span class="k">Status:</span><span id="fStatus" class="v muted">—</span></div>
    <div class="kv"><span class="k">Location:</span><span id="fLocation" class="v muted">—</span></div>
    <div class="kv"><span class="k">Notes:</span><span id="fNotes" class="v muted">—</span></div>
  </div>

  <div class="card">
    <div id="errors" class="muted">—</div>
  </div>

  <script>
    const pickBtn = document.getElementById("pickBtn");
    const resultCard = document.getElementById("resultCard");
    const cover = document.getElementById("cover");
    const coverPlaceholder = document.getElementById("coverPlaceholder");
    const errors = document.getElementById("errors");

    const fields = {
      title: document.getElementById("fTitle"),
      type: document.getElementById("fType"),
      author: document.getElementById("fAuthor"),
      platform: document.getElementById("fPlatform"),
      developer: document.getElementById("fDeveloper"),
      format: document.getElementById("fFormat"),
      year: document.getElementById("fYear"),
      status: document.getElementById("fStatus"),
      location: document.getElementById("fLocation"),
      notes: document.getElementById("fNotes"),
    };

    function setError(msg) {
      errors.textContent = msg || "—";
      errors.className = msg ? "err" : "muted";
    }

    function fill(el, value) {
      el.textContent = (value === null || value === undefined || value === "") ? "—" : value;
    }

    async function pickRandom() {
      pickBtn.disabled = true;
      pickBtn.textContent = "Picking…";
      setError("");

      try {
        const r = await fetch("/media/random");
        const data = await r.json().catch(() => null);

        if (r.status === 404) {
          resultCard.style.display = "none";
          setError("Your library is empty — nothing to pick from yet.");
          return;
        }
        if (!r.ok) throw new Error(data?.detail || `HTTP ${r.status}`);

        const item = data.item;

        if (item.cover_url) {
          cover.src = item.cover_url;
          cover.style.display = "block";
          coverPlaceholder.style.display = "none";
        } else {
          cover.removeAttribute("src");
          cover.style.display = "none";
          coverPlaceholder.style.display = "flex";
        }

        fill(fields.title, item.title);
        fill(fields.type, item.media_type);
        fill(fields.author, item.author);
        fill(fields.platform, item.platform);
        fill(fields.developer, item.developer);
        fill(fields.format, item.format);
        fill(fields.year, item.release_year);
        fill(fields.status, item.status);
        fill(fields.location, item.location);
        fill(fields.notes, item.notes);

        resultCard.style.display = "block";
      } catch (e) {
        resultCard.style.display = "none";
        setError("Failed to get a random pick: " + e);
      } finally {
        pickBtn.disabled = false;
        pickBtn.textContent = "Pick Something";
      }
    }

    // If the cover URL is broken/unreachable, fall back to the placeholder
    // instead of showing a broken-image icon.
    cover.addEventListener("error", () => {
      cover.style.display = "none";
      coverPlaceholder.style.display = "flex";
    });

    pickBtn.addEventListener("click", pickRandom);

    // Earlier versions of this app installed a service worker (media/sq.js).
    // It's gone now — this unregisters any leftover copy still active on a
    // returning device, so old devices self-heal instead of needing a manual
    // "clear site data".
    (function cleanupLegacyServiceWorker() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(regs => regs.forEach(r => r.unregister()))
          .catch(() => {});
      }
      if ("caches" in window) {
        caches.keys()
          .then(keys => Promise.all(keys.map(k => caches.delete(k))))
          .catch(() => {});
      }
    })();
  </script>
</body>
</html>
