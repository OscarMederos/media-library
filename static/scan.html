<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scan Media</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    video {
      width: 100%;
      max-width: 520px;
      border-radius: 12px;
      margin-top: 1rem;
      background: #000;
    }
    .row {
      display: flex;
      gap: .5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: .75rem;
    }
    button {
      font-size: 1.05rem;
      padding: .7rem 1rem;
      border-radius: 10px;
      border: 0;
    }
    #start { background: #4caf50; color: #000; }
    #stop { background: #ffb300; color: #000; display: none; }
    #library { background: #1e88e5; color: #fff; }

    .card {
      background: #1c1c1c;
      padding: 1rem;
      border-radius: 12px;
      margin: 1rem auto 0;
      max-width: 520px;
      text-align: left;
    }
    .muted { color: #aaa; }
    .ok { color: #8bc34a; }
    .err { color: #ef5350; }

    .kv { margin-top: .45rem; }
    .k { font-weight: 650; }
    .v { margin-left: .25rem; }

    .pill {
      display: inline-block;
      padding: .15rem .45rem;
      border-radius: 999px;
      background: #2a2a2a;
      margin-left: .35rem;
      font-size: .85rem;
      color: #ddd;
    }

    .actions {
      display:flex;
      gap:.5rem;
      flex-wrap:wrap;
      margin-top:.8rem;
    }
    .enrich {
      background:#7e57c2;
      color:#fff;
      padding:.55rem .8rem;
      border-radius:10px;
      border:0;
      font-size:1rem;
    }
    .enrich[disabled] { opacity:.7; }
    .thumb {
      display:block;
      width:100%;
      max-width: 220px;
      border-radius: 10px;
      margin-top: .75rem;
      background:#000;
    }
  </style>
</head>

<body>
  <h2>📷 Scan Barcode</h2>

  <div class="row">
    <button id="start">Start Camera</button>
    <button id="stop">Stop Camera</button>
    <button id="library" onclick="location.href='/ui/library.html'">View Library</button>
  </div>

  <video id="video" playsinline></video>

  <div class="card">
    <div class="kv">
      <span class="k">Status:</span>
      <span id="status" class="v muted">Ready</span>
      <span id="net" class="pill">…</span>
    </div>

    <div class="kv">
      <span class="k">Last barcode:</span>
      <span id="lastBarcode" class="v muted">—</span>
    </div>
  </div>

  <div class="card">
    <div class="kv"><span class="k">Server response</span></div>

    <div class="kv"><span class="k">Result:</span><span id="srResult" class="v muted">—</span></div>
    <div class="kv"><span class="k">Title:</span><span id="srTitle" class="v muted">—</span></div>
    <div class="kv"><span class="k">Type:</span><span id="srType" class="v muted">—</span></div>
    <div class="kv"><span class="k">Author:</span><span id="srAuthor" class="v muted">—</span></div>
    <div class="kv"><span class="k">Developer:</span><span id="srDeveloper" class="v muted">—</span></div>
    <div class="kv"><span class="k">Year:</span><span id="srYear" class="v muted">—</span></div>
    <div class="kv"><span class="k">ID:</span><span id="srId" class="v muted">—</span></div>

    <div class="kv"><span class="k">Barcode (normalized):</span><span id="srBarcode" class="v muted">—</span></div>
    <div class="kv"><span class="k">Source:</span><span id="srSource" class="v muted">—</span></div>
    <div class="kv"><span class="k">Platform:</span><span id="srPlatform" class="v muted">—</span></div>

    <img id="srCover" class="thumb" alt="" style="display:none;" />

    <div class="actions">
      <button id="enrichOmdb" class="enrich" style="display:none;">Enrich OMDb</button>
      <button id="enrichIgdb" class="enrich" style="display:none;">Enrich IGDB</button>
    </div>
  </div>

  <div class="card">
    <div class="kv"><span class="k">Errors:</span><span id="errors" class="v muted">—</span></div>
  </div>

  <!-- Local ZXing UMD bundle served from /ui/zxing.min.js -->
  <script src="/ui/zxing.min.js"></script>
  <script>
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const video = document.getElementById("video");

    const statusEl = document.getElementById("status");
    const netEl = document.getElementById("net");
    const lastBarcodeEl = document.getElementById("lastBarcode");
    const errorsEl = document.getElementById("errors");

    const srResult = document.getElementById("srResult");
    const srTitle = document.getElementById("srTitle");
    const srType = document.getElementById("srType");
    const srAuthor = document.getElementById("srAuthor");
    const srDeveloper = document.getElementById("srDeveloper");
    const srYear = document.getElementById("srYear");
    const srId = document.getElementById("srId");
    const srBarcode = document.getElementById("srBarcode");
    const srSource = document.getElementById("srSource");
    const srPlatform = document.getElementById("srPlatform");
    const srCover = document.getElementById("srCover");

    const enrichOmdbBtn = document.getElementById("enrichOmdb");
    const enrichIgdbBtn = document.getElementById("enrichIgdb");

    let stream = null;
    let scanning = false;
    let reader = null;

    // Debounce duplicate scans
    let lastSent = null;
    let lastSentAt = 0;

    // Track last item for enrichment buttons
    let lastItem = null;

    function setStatus(text, cls = "muted") {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    function updateNet() {
      netEl.textContent = navigator.onLine ? "online" : "offline";
    }

    function setError(msg) {
      errorsEl.textContent = msg || "—";
      errorsEl.className = msg ? "v err" : "v muted";
    }

    function setText(el, value, okClass = null) {
      el.textContent = (value === null || value === undefined || value === "") ? "—" : String(value);
      el.className = "v " + (okClass || "muted");
    }

    function setCover(url) {
      if (!url) {
        srCover.style.display = "none";
        srCover.removeAttribute("src");
        srCover.alt = "";
        return;
      }
      srCover.src = url;
      srCover.alt = "Cover";
      srCover.style.display = "block";
    }

    function clearServerResponse() {
      lastItem = null;
      enrichOmdbBtn.style.display = "none";
      enrichIgdbBtn.style.display = "none";
      enrichOmdbBtn.disabled = false;
      enrichIgdbBtn.disabled = false;

      setText(srResult, "—");
      setText(srTitle, "—");
      setText(srType, "—");
      setText(srAuthor, "—");
      setText(srDeveloper, "—");
      setText(srYear, "—");
      setText(srId, "—");
      setText(srBarcode, "—");
      setText(srSource, "—");
      setText(srPlatform, "—");
      setCover(null);
    }

    function stopCamera() {
      scanning = false;
      try { if (reader) reader.reset(); } catch {}
      reader = null;

      if (stream) {
        try { stream.getTracks().forEach(t => t.stop()); } catch {}
      }
      stream = null;

      stopBtn.style.display = "none";
      startBtn.style.display = "inline-block";
      setStatus("Stopped", "muted");
    }

    function isBlank(v) {
      return v === null || v === undefined || String(v).trim() === "";
    }

    function shouldShowOmdb(item) {
      const mt = String(item?.media_type || "unknown").toLowerCase().trim();
      if (mt !== "movie" && mt !== "series") return false;
      const status = String(item?.omdb_status || "").toLowerCase().trim();
      return status !== "ok";
    }

    function shouldShowIgdb(item) {
      const mt = String(item?.media_type || "unknown").toLowerCase().trim();
      if (mt !== "game") return false;
      const missingDeveloper = isBlank(item?.developer);
      const missingYear = isBlank(item?.release_year);
      const missingCover = isBlank(item?.cover_url);
      const missingIgdbId = isBlank(item?.igdb_game_id);
      return missingDeveloper || missingYear || missingCover || missingIgdbId;
    }

    function renderItemToUI(item, meta = {}) {
      lastItem = item || null;

      setText(srTitle, item?.title, "ok");
      setText(srType, item?.media_type || "unknown", "muted");
      setText(srAuthor, (item?.media_type === "book" ? (item?.author || "—") : "—"), "muted");
      setText(srDeveloper, (item?.media_type === "game" ? (item?.developer || "—") : "—"), "muted");
      setText(srYear, item?.release_year || "—", "muted");
      setText(srId, item?.id, "muted");
      setText(srBarcode, meta.normalized_barcode || item?.barcode, "muted");
      setText(srSource, item?.source || meta?.lookup?.provider || "—", "muted");
      setText(srPlatform, item?.platform || "—", "muted");

      setCover(item?.cover_url || null);

      const showOmdb = shouldShowOmdb(item);
      const showIgdb = shouldShowIgdb(item);

      enrichOmdbBtn.style.display = showOmdb ? "inline-block" : "none";
      enrichIgdbBtn.style.display = showIgdb ? "inline-block" : "none";
    }

    async function refreshItem(id, meta = {}) {
      try {
        const r = await fetch(`/media/${id}`);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const item = await r.json();
        renderItemToUI(item, meta);
      } catch (e) {
        // keep existing UI; show error
        setError("Refresh failed: " + e);
      }
    }

    // Single handler for both providers now that the backend returns one
    // consistent envelope: {status, reason, item}. status is "ok" | "not_found"
    // | "skipped" | "error"; reason is always present (null on success).
    async function doEnrich(provider, btn, label) {
      if (!lastItem?.id) return;
      btn.disabled = true;
      btn.textContent = "Enriching…";

      try {
        const r = await fetch(`/media/${lastItem.id}/enrich?provider=${provider}`, { method: "POST" });
        const data = await r.json().catch(() => null);
        if (!r.ok) throw new Error(data?.detail || `HTTP ${r.status}`);

        if (data?.status === "not_found") {
          setError(`${label}: no match found`);
        } else if (data?.status === "skipped") {
          setError(`${label}: skipped (${data.reason || "n/a"})`);
        } else if (data?.status === "error") {
          setError(`${label} failed: ${data.reason || "unknown error"}`);
        } else {
          setError("");
        }

        await refreshItem(lastItem.id, { normalized_barcode: lastItem.barcode });
      } catch (e) {
        setError(`${label} failed: ` + e);
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    }

    function doOmdbEnrich() { return doEnrich("omdb", enrichOmdbBtn, "Enrich OMDb"); }
    function doIgdbEnrich() { return doEnrich("igdb", enrichIgdbBtn, "Enrich IGDB"); }

    async function startCamera() {
      setError("");
      clearServerResponse();
      setStatus("Requesting camera…", "muted");

      if (!window.ZXingBrowser || !window.ZXingBrowser.BrowserMultiFormatReader) {
        setStatus("Scanner JS not loaded", "err");
        setError("Could not find ZXingBrowser. Make sure /ui/zxing.min.js exists and loads.");
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        await video.play();

        reader = new ZXingBrowser.BrowserMultiFormatReader();
        scanning = true;

        startBtn.style.display = "none";
        stopBtn.style.display = "inline-block";
        setStatus("Scanning… point at barcode", "ok");

        reader.decodeFromVideoElement(video, async (result) => {
          if (!result || !scanning) return;

          const barcode = result.getText();
          const now = Date.now();

          // Prevent rapid repeats of the same code
          if (barcode === lastSent && (now - lastSentAt) < 2000) return;
          lastSent = barcode;
          lastSentAt = now;

          lastBarcodeEl.textContent = barcode;
          lastBarcodeEl.className = "v ok";

          setStatus("Saving…", "muted");
          setError("");

          setText(srResult, "saving…", "muted");
          setCover(null);

          try {
            const resp = await fetch("/scan", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ barcode })
            });

            const text = await resp.text();
            let data;
            try { data = JSON.parse(text); } catch { data = { raw: text }; }

            if (!resp.ok) {
              setStatus("Server error", "err");
              setText(srResult, `error (${resp.status})`, "err");
              setError(data?.detail || data?.raw || `HTTP ${resp.status}`);
              return;
            }

            // Expected shape:
            // { status, normalized_barcode, item: {...}, lookup, db }
            const resultStatus = data?.status || "ok";
            const item = data?.item || {};

            setStatus("Saved. Keep scanning…", "ok");
            setText(srResult, resultStatus, (resultStatus === "added") ? "ok" : "muted");

            // Populate from scan response first
            renderItemToUI(item, data);

            // Then refresh from server to pick up any server-side defaults / later enriches
            if (item?.id) await refreshItem(item.id, data);

            navigator.vibrate?.(120);

          } catch (e) {
            setStatus("Failed to reach server", "err");
            setText(srResult, "network error", "err");
            setError(String(e));
          }
        });

      } catch (e) {
        setStatus("Camera failed", "err");
        setError(String(e));
      }
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    enrichOmdbBtn.addEventListener("click", doOmdbEnrich);
    enrichIgdbBtn.addEventListener("click", doIgdbEnrich);

    window.addEventListener("online", updateNet);
    window.addEventListener("offline", updateNet);

    // Earlier versions of this app installed a service worker (media/sq.js).
    // It's gone now — this unregisters any leftover copy still active on a
    // returning device, so old devices self-heal instead of needing a manual
    // "clear site data" like previous deploys required.
    (function cleanupLegacyServiceWorker() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(regs => regs.forEach(r => r.unregister()))
          .catch(() => {});
      }
      if ("caches" in window) {
        caches.keys()
          .then(keys => Promise.all(keys.map(k => caches.delete(k))))
          .catch(() => {});
      }
    })();

    updateNet();
    setStatus("Ready. Tap Start Camera.", "muted");
    clearServerResponse();
  </script>
</body>
</html>
