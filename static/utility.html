<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Media Library Reporting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root { --bg:#0f0f0f; --panel:#171717; --panel2:#1f1f1f; --text:#fff; --muted:#bdbdbd; --line:#2a2a2a; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:1rem; }
    h2 { margin:.25rem 0 1rem; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1rem; }
    .row { display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; }
    .spacer { flex:1; }
    button { background:#2b2b2b; border:1px solid var(--line); color:var(--text); padding:.65rem .9rem; border-radius:12px; cursor:pointer; }
    button:hover { background:#353535; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .ok { color:#a8ffb3; }
    .warn { color:#ffd37a; }
    .err { color:#ff9a9a; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; padding:.15rem .5rem; border-radius:999px; border:1px solid var(--line); background:#151515; }
    .grid2 { display:grid; gap:.75rem; grid-template-columns: 1fr 1fr; margin-top:.75rem; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    .log { white-space:pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background:#0c0c0c; border:1px solid var(--line); border-radius:12px; padding:.75rem; max-height:240px; overflow:auto; margin-top:.75rem; }

    /* chart sizing fixes */
    .chartTile { margin:0; height:260px; display:flex; flex-direction:column; }
    .chartTitle { font-size:.85rem; color:var(--muted); margin-bottom:.35rem; }
    .chartBox { flex:1; min-height:0; }
    .chartBox canvas { width:100% !important; height:100% !important; display:block; }
  </style>
</head>
<body>
  <h2>Media Library Reporting</h2>

  <div class="panel">
    <div class="row">
      <button id="btnLoad">Load data</button>
      <button id="btnReport">Generate charts</button>
      <button id="btnExportPng">Export charts (PNG)</button>
      <div class="spacer"></div>
      <div class="muted">
        Loaded rows: <span id="loadedCount" class="pill">0</span>
      </div>
    </div>

    <div class="grid2">
      <div class="panel chartTile">
        <div class="chartTitle">Media type</div>
        <div class="chartBox"><canvas id="chartMediaType"></canvas></div>
      </div>

      <div class="panel chartTile">
        <div class="chartTitle">Books missing author</div>
        <div class="chartBox"><canvas id="chartBooksMissingAuthor"></canvas></div>
      </div>

      <div class="panel chartTile">
        <div class="chartTitle">Games missing platform</div>
        <div class="chartBox"><canvas id="chartGamesMissingPlatform"></canvas></div>
      </div>

      <div class="panel chartTile">
        <div class="chartTitle">Movies missing format</div>
        <div class="chartBox"><canvas id="chartMoviesMissingFormat"></canvas></div>
      </div>
    </div>

    <div id="logOut" class="log"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    let loaded = [];
    let charts = {
      mediaType: null,
      booksMissingAuthor: null,
      gamesMissingPlatform: null,
      moviesMissingFormat: null,
    };

    function log(line, cls="muted") {
      const el = $("logOut");
      const div = document.createElement("div");
      div.className = cls;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${line}`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    function setBusy(isBusy) {
      for (const id of ["btnLoad","btnReport","btnExportPng"]) {
        $(id).disabled = isBusy;
      }
    }

    async function apiJson(url, opts={}) {
      const r = await fetch(url, {
        headers: { "Content-Type":"application/json", ...(opts.headers||{}) },
        ...opts
      });

      if (!r.ok) {
        const ct = r.headers.get("content-type") || "";
        let detail = "";
        if (ct.includes("application/json")) {
          try { detail = (await r.json())?.detail ?? ""; } catch (_) {}
        } else {
          try { detail = (await r.text()).slice(0, 200); } catch (_) {}
        }
        throw new Error(`HTTP ${r.status} ${r.statusText}${detail ? " - " + detail : ""}`);
      }

      return r.json();
    }

    function isEmpty(v) {
      return v === null || v === undefined || String(v).trim() === "";
    }

    function mtLower(r) {
      return String(r.media_type || "").trim().toLowerCase();
    }

    function isBook(r) { return mtLower(r) === "book"; }
    function isMovie(r) { return mtLower(r) === "movie"; }
    // main.py can infer "game" from UPC; some manual entries may be "video_game"
    function isGame(r) {
      const v = mtLower(r);
      return v === "game" || v === "video_game" || v === "games";
    }

    function destroyChart(c) {
      if (c) c.destroy();
      return null;
    }

    function destroyAllCharts() {
      charts.mediaType = destroyChart(charts.mediaType);
      charts.booksMissingAuthor = destroyChart(charts.booksMissingAuthor);
      charts.gamesMissingPlatform = destroyChart(charts.gamesMissingPlatform);
      charts.moviesMissingFormat = destroyChart(charts.moviesMissingFormat);
    }

    function recreateCanvas(canvasId) {
      const oldCanvas = document.getElementById(canvasId);
      if (!oldCanvas) return null;
      const parent = oldCanvas.parentElement;
      const newCanvas = document.createElement("canvas");
      newCanvas.id = canvasId;
      parent.replaceChild(newCanvas, oldCanvas);
      return newCanvas;
    }

    function buildDoughnut(canvasId, labels, values, title) {
      const canvas = recreateCanvas(canvasId);
      return new Chart(canvas, {
        type: "doughnut",
        data: { labels, datasets: [{ label: title, data: values }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } }
        }
      });
    }

    function countMediaTypes(rows) {
      const m = new Map();
      for (const r of rows) {
        const mt = String(r.media_type || "").trim();
        const k = mt ? mt : "null";
        m.set(k, (m.get(k) || 0) + 1);
      }
      return [...m.entries()].sort((a,b) => b[1] - a[1]);
    }

    async function loadData() {
      setBusy(true);
      try {
        log("Loading /media ...");
        loaded = await apiJson("/media", { method: "GET" });
        $("loadedCount").textContent = String(Array.isArray(loaded) ? loaded.length : 0);
        log(`Loaded ${loaded.length} rows.`, "ok");
      } catch (e) {
        log(String(e), "err");
        loaded = [];
        $("loadedCount").textContent = "0";
      } finally {
        setBusy(false);
      }
    }

    function generateCharts() {
      if (!Array.isArray(loaded) || loaded.length === 0) {
        log("No loaded rows. Click Load data first.", "warn");
        return;
      }
      if (typeof Chart === "undefined") {
        log("Chart.js failed to load (CDN).", "err");
        return;
      }

      destroyAllCharts();

      // 1) media type
      const mtEntries = countMediaTypes(loaded);
      charts.mediaType = buildDoughnut(
        "chartMediaType",
        mtEntries.map(([k]) => k),
        mtEntries.map(([,v]) => v),
        "Media type"
      );

      // 2) books missing author
      const bookRows = loaded.filter(isBook);
      const booksMissingAuthor = bookRows.filter(r => isEmpty(r.author)).length;
      const booksHasAuthor = Math.max(0, bookRows.length - booksMissingAuthor);
      charts.booksMissingAuthor = buildDoughnut(
        "chartBooksMissingAuthor",
        ["has author", "missing author"],
        [booksHasAuthor, booksMissingAuthor],
        "Books missing author"
      );

      // 3) games missing platform
      const gameRows = loaded.filter(isGame);
      const gamesMissingPlatform = gameRows.filter(r => isEmpty(r.platform)).length;
      const gamesHasPlatform = Math.max(0, gameRows.length - gamesMissingPlatform);
      charts.gamesMissingPlatform = buildDoughnut(
        "chartGamesMissingPlatform",
        ["has platform", "missing platform"],
        [gamesHasPlatform, gamesMissingPlatform],
        "Games missing platform"
      );

      // 4) movies missing format
      const movieRows = loaded.filter(isMovie);
      const moviesMissingFormat = movieRows.filter(r => isEmpty(r.format)).length;
      const moviesHasFormat = Math.max(0, movieRows.length - moviesMissingFormat);
      charts.moviesMissingFormat = buildDoughnut(
        "chartMoviesMissingFormat",
        ["has format", "missing format"],
        [moviesHasFormat, moviesMissingFormat],
        "Movies missing format"
      );

      log("Generated charts.", "ok");
    }

    function exportChartsPng() {
      if (!Array.isArray(loaded) || loaded.length === 0) {
        log("No loaded rows.", "warn");
        return;
      }

      const ids = [
        ["chartMediaType", "media_type"],
        ["chartBooksMissingAuthor", "books_missing_author"],
        ["chartGamesMissingPlatform", "games_missing_platform"],
        ["chartMoviesMissingFormat", "movies_missing_format"],
      ];

      const stamp = new Date().toISOString().slice(0,10);
      for (const [canvasId, name] of ids) {
        const c = document.getElementById(canvasId);
        if (!c) continue;
        const url = c.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = url;
        a.download = `media_report_${name}_${stamp}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      log("Exported chart PNGs.", "ok");
    }

    $("btnLoad").addEventListener("click", loadData);
    $("btnReport").addEventListener("click", generateCharts);
    $("btnExportPng").addEventListener("click", exportChartsPng);

    // Auto-load once
    loadData();
  </script>
</body>
</html>
